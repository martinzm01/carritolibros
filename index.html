<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda de Libros</title>
    <style>
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 30px;
        }
        #agregarLibros{
            border: 1px solid black;    
            border-radius: 3px;
            padding:10px;
            margin-bottom: 20px;
        }
        #librosDisponibles{
            border: 1px solid black;    
            border-radius: 3px;
            padding:10px;
            margin-bottom: 20px;
        }
        #carritoCompras{
            border: 1px solid black;    
            border-radius: 3px;
            padding:10px;
            margin-bottom: 20px;   
        }
        h1, h2 {
            font-weight: bold;
        }
        .libro, .carrito-item {
            margin-bottom: 10px;
        }
        .total {
            font-weight: bold;
            color: blue;
        }
        
    </style>
</head>
<body>
    <header><h1>Tienda de Libros</h1></header>
    <section id="agregarLibros">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo"><br><br>
        
        <label for="precio">Precio:</label>
        <input type="number" id="precio" min="0" step="0.01"><br><br>

        <button onclick="agregarLibro()">Agregar Libro</button>
    </section>

    <section id="librosDisponibles">
        
        <h2>Libros Disponibles</h2>
        <div id="lista-libros"></div>
    
    </section>

    <section id="carritoCompras">
        <h2>Carrito de Compras</h2>
        <ul id="carrito"></ul>
        <p class="total" id="total">Total: $0.00</p>
    </section>

    <script>
        const listaLibros = document.getElementById("lista-libros");
        const carrito = document.getElementById("carrito");
        const totalTexto = document.getElementById("total");

        let total = 0;

        function agregarLibro() {
            const titulo = document.getElementById("titulo").value.trim();
            const precio = parseFloat(document.getElementById("precio").value);

            if (titulo === "" || isNaN(precio) || precio < 0) {
                alert("Por favor, ingrese un título válido y un precio numérico positivo.");
                return;
            }

            const div = document.createElement("div");
            div.classList.add("libro");

            const nombreLibro = document.createElement("p");
            nombreLibro.textContent = titulo;

            const precioLibro = document.createElement("p");
            precioLibro.textContent = `Precio: $${precio.toFixed(2)}`;

            const botonAgregar = document.createElement("button");
            botonAgregar.textContent = "Agregar al carrito";
            botonAgregar.onclick = function () {
                agregarAlCarrito(titulo, precio);
            };

            div.appendChild(nombreLibro);
            div.appendChild(precioLibro);
            div.appendChild(botonAgregar);

            listaLibros.appendChild(div);

            // Limpiar campos
            document.getElementById("titulo").value = "";
            document.getElementById("precio").value = "";
        }

        function agregarAlCarrito(titulo, precio) {
            const li = document.createElement("li");
            li.classList.add("carrito-item");

            li.textContent = `${titulo} - $${precio.toFixed(2)} `;

            const botonEliminar = document.createElement("button");
            botonEliminar.textContent = "Eliminar";
            botonEliminar.onclick = function () {
                carrito.removeChild(li);
                total -= precio;
                actualizarTotal();
            };

            li.appendChild(botonEliminar);
            carrito.appendChild(li);

            total += precio;
            actualizarTotal();
        }

        function actualizarTotal() {
            totalTexto.textContent = `Total: $${total.toFixed(2)}`;
        }
    </script>

</body>
</html>
